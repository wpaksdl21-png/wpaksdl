<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>박제현 | 공식 사업자 정보</title>
  <meta name="description" content="박제현 공식 사업자 정보 페이지" />
  <style>
    :root {
      --ink: #172036;
      --muted: #637083;
      --line: #dce3ea;
      --paper: #ffffff;
      --accent: #174f43;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background:
        linear-gradient(135deg, rgba(23, 79, 67, 0.08), transparent 45%),
        #f4f1e9;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-top: 6px solid var(--accent);
      box-shadow: 0 18px 55px rgba(23, 32, 54, 0.09);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: -0.06em;
    }
    .subtitle {
      margin: 0 0 36px;
      color: var(--muted);
    }
    dl {
      display: grid;
      grid-template-columns: 130px 1fr;
      margin: 0;
      border-top: 1px solid var(--line);
    }
    dt, dd {
      margin: 0;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    dt { font-weight: 700; }
    dd { color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 4px; }
    @media (max-width: 560px) {
      dl { grid-template-columns: 1fr; }
      dt { padding-bottom: 4px; border-bottom: 0; }
      dd { padding-top: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>박제현</h1>
    <p class="subtitle">공식 사업자 정보</p>
    <dl>
      <dt>상호</dt>
      <dd>박제현</dd>
      <dt>대표자</dt>
      <dd>박제현</dd>
      <dt>사업장 주소</dt>
      <dd>전남광주통합특별시 북구 경양로73번길 30-4, 1층(신안동)</dd>
      <dt>공식 웹사이트</dt>
      <dd><a href="https://bccccd.kr">https://bccccd.kr</a></dd>
    </dl>
  </main>
</body>
</html>
